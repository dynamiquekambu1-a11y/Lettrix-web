<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login – Lettrix</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; }
    .content { max-width: 400px; margin: 80px auto; padding: 30px; background: #fff; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1);}
    h1 { text-align: center; color: #333; }
    label { display: block; margin-bottom: 5px; color: #555; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: #007BFF; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
    button:hover { background: #0056b3; }
    p { text-align: center; }
    a { color: #007BFF; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .flash { background: #ffdddd; padding: 10px; margin-bottom: 15px; border-left: 5px solid #ff5c5c; }
  </style>
</head>
<body>

<div class="content">
  <h1>Login</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[0] }}</div>
    {% endif %}
  {% endwith %}

  <form method="post">
    <label>Username:</label>
    <input type="text" name="username" required>

    <label>Password:</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>
  </form>

  <p>
    Don't have an account? <a href="{{ url_for('register') }}">Register here</a>.
  </p>
</div>

</body>
</html>
